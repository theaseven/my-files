
<style>
.step-dot { width:10px;height:10px;border-radius:50%;background:var(--color-border-secondary);display:inline-block;transition:background .2s; }
.step-dot.active { background:#534AB7; }
.step-btn { padding:7px 20px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;cursor:pointer;font-size:13px;color:var(--color-text-secondary); }
.step-btn:hover { background:var(--color-background-secondary); }
.code-line { font-family:var(--font-mono);font-size:12px;padding:3px 10px;border-radius:4px;color:var(--color-text-secondary);transition:background .2s,color .2s; }
.code-line.hi { background:#EEEDFE;color:#3C3489; }
.tag { display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500; }
.tag-teal { background:#E1F5EE;color:#0F6E56; }
.tag-purple { background:#EEEDFE;color:#534AB7; }
.tag-coral { background:#FAECE7;color:#993C1D; }
.tag-amber { background:#FAEEDA;color:#854F0B; }
@media (prefers-color-scheme: dark) {
  .code-line.hi { background:#3C3489;color:#CECBF6; }
  .tag-teal { background:#085041;color:#9FE1CB; }
  .tag-purple { background:#3C3489;color:#CECBF6; }
  .tag-coral { background:#712B13;color:#F5C4B3; }
  .tag-amber { background:#633806;color:#FAC775; }
}
</style>

<div style="padding:1rem 0;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px;">
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="step-dot active" id="dot0"></span>
      <span class="step-dot" id="dot1"></span>
      <span class="step-dot" id="dot2"></span>
      <span class="step-dot" id="dot3"></span>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="step-btn" onclick="prevStep()">← 上一步</button>
      <button class="step-btn" onclick="nextStep()">下一步 →</button>
    </div>
  </div>

  <div id="panel"></div>
</div>

<script>
const steps = [
  {
    title: '初始化网络',
    tag: '初始化', tagClass: 'tag-teal',
    codes: [
      'n, d_in, h, d_out = 64, 1000, 100, 10',
      'x = np.random.randn(n, d_in)   # (64, 1000)',
      'y = np.random.randn(n, d_out)  # (64, 10)',
      'w1 = np.random.randn(d_in, h)  # (1000, 100)',
      'w2 = np.random.randn(h, d_out) # (100, 10)',
      'learning_rate = 1e-6',
    ],
    hiLines: [0,1,2,3,4,5],
    svg: `<svg width="100%" viewBox="0 0 680 160">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g class="c-teal"><rect x="30" y="58" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="90" y="76" text-anchor="middle" dominant-baseline="central">输入 x</text><text class="ts" x="90" y="92" text-anchor="middle" dominant-baseline="central">(64 × 1000)</text></g>
      <line x1="150" y1="80" x2="195" y2="80" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
      <text class="ts" x="172" y="70" text-anchor="middle">W1</text>
      <text class="ts" x="172" y="96" text-anchor="middle">(1000×100)</text>
      <g class="c-purple"><rect x="200" y="58" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="76" text-anchor="middle" dominant-baseline="central">隐藏层 h</text><text class="ts" x="260" y="92" text-anchor="middle" dominant-baseline="central">(64 × 100)</text></g>
      <line x1="320" y1="80" x2="365" y2="80" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
      <text class="ts" x="342" y="70" text-anchor="middle">W2</text>
      <text class="ts" x="342" y="96" text-anchor="middle">(100×10)</text>
      <g class="c-coral"><rect x="370" y="58" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="430" y="76" text-anchor="middle" dominant-baseline="central">输出 ŷ</text><text class="ts" x="430" y="92" text-anchor="middle" dominant-baseline="central">(64 × 10)</text></g>
      <g class="c-amber"><rect x="550" y="58" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="605" y="76" text-anchor="middle" dominant-baseline="central">目标 y</text><text class="ts" x="605" y="92" text-anchor="middle" dominant-baseline="central">(64 × 10)</text></g>
      <text class="ts" x="490" y="72" text-anchor="middle">对比</text>
      <line x1="490" y1="80" x2="548" y2="80" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    </svg>`,
    notes: [
      { label: 'n=64', desc: '每次训练用 64 个样本（batch size）' },
      { label: 'W1: (1000,100)', desc: '1000 个输入特征 → 100 个隐藏节点' },
      { label: 'W2: (100,10)', desc: '100 个隐藏节点 → 10 个输出' },
      { label: '随机初始化', desc: 'W 从正态分布随机取值，训练会逐步调整它' },
    ]
  },
  {
    title: '前向传播（Forward）',
    tag: '前向', tagClass: 'tag-purple',
    codes: [
      'temp = x.dot(w1)                 # (64,1000)·(1000,100) → (64,100)',
      'temp_relu = np.maximum(temp, 0)  # ReLU激活，负值归零',
      'y_pred = temp_relu.dot(w2)       # (64,100)·(100,10) → (64,10)',
      'loss = np.square(y_pred - y).sum()  # 均方误差',
    ],
    hiLines: [0,1,2,3],
    svg: `<svg width="100%" viewBox="0 0 680 170">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g class="c-teal"><rect x="20" y="63" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="65" y="81" text-anchor="middle" dominant-baseline="central">x</text><text class="ts" x="65" y="97" text-anchor="middle" dominant-baseline="central">(64,1000)</text></g>
      <line x1="110" y1="85" x2="148" y2="85" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-purple"><rect x="150" y="50" width="110" height="70" rx="8" stroke-width="0.5"/><text class="th" x="205" y="72" text-anchor="middle" dominant-baseline="central">dot(x, W1)</text><text class="ts" x="205" y="90" text-anchor="middle" dominant-baseline="central">线性变换</text><text class="ts" x="205" y="108" text-anchor="middle" dominant-baseline="central">→ (64,100)</text></g>
      <line x1="260" y1="85" x2="298" y2="85" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-green"><rect x="300" y="50" width="110" height="70" rx="8" stroke-width="0.5"/><text class="th" x="355" y="72" text-anchor="middle" dominant-baseline="central">ReLU</text><text class="ts" x="355" y="90" text-anchor="middle" dominant-baseline="central">max(·, 0)</text><text class="ts" x="355" y="108" text-anchor="middle" dominant-baseline="central">→ (64,100)</text></g>
      <line x1="410" y1="85" x2="448" y2="85" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-purple"><rect x="450" y="63" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="495" y="81" text-anchor="middle" dominant-baseline="central">dot(·,W2)</text><text class="ts" x="495" y="97" text-anchor="middle" dominant-baseline="central">(64,10)</text></g>
      <line x1="540" y1="85" x2="578" y2="85" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-coral"><rect x="580" y="63" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="620" y="81" text-anchor="middle" dominant-baseline="central">Loss</text><text class="ts" x="620" y="97" text-anchor="middle" dominant-baseline="central">(ŷ-y)²</text></g>
      <text class="ts" x="340" y="148" text-anchor="middle">数据从左向右流动，最终算出预测误差 Loss</text>
    </svg>`,
    notes: [
      { label: 'dot(x, W1)', desc: '矩阵乘法：64个样本同时计算，效率高' },
      { label: 'ReLU', desc: 'max(temp, 0)：负数全部变0，引入非线性' },
      { label: 'Loss = Σ(ŷ-y)²', desc: '预测值与真实值的差的平方求和，越小越好' },
    ]
  },
  {
    title: '反向传播（Backward）',
    tag: '反向', tagClass: 'tag-coral',
    codes: [
      'grad_y_pred = 2.0 * (y_pred - y)         # ∂L/∂ŷ',
      'grad_w2 = temp_relu.T.dot(grad_y_pred)   # ∂L/∂W2',
      'grad_temp_relu = grad_y_pred.dot(w2.T)   # ∂L/∂z',
      'grad_temp = grad_temp_relu.copy()',
      'grad_temp[temp < 0] = 0                  # ReLU梯度：负区间置零',
      'grad_w1 = x.T.dot(grad_temp)             # ∂L/∂W1',
    ],
    hiLines: [0,1,2,3,4,5],
    svg: `<svg width="100%" viewBox="0 0 680 170">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g class="c-gray"><rect x="20" y="63" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="65" y="81" text-anchor="middle" dominant-baseline="central">grad_W1</text><text class="ts" x="65" y="97" text-anchor="middle" dominant-baseline="central">∂L/∂W1</text></g>
      <line x1="148" y1="85" x2="112" y2="85" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-coral"><rect x="150" y="50" width="110" height="70" rx="8" stroke-width="0.5"/><text class="th" x="205" y="72" text-anchor="middle" dominant-baseline="central">ReLU 梯度</text><text class="ts" x="205" y="90" text-anchor="middle" dominant-baseline="central">负区间=0</text><text class="ts" x="205" y="108" text-anchor="middle" dominant-baseline="central">正区间透传</text></g>
      <line x1="298" y1="85" x2="262" y2="85" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-coral"><rect x="300" y="63" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="350" y="81" text-anchor="middle" dominant-baseline="central">grad_W2</text><text class="ts" x="350" y="97" text-anchor="middle" dominant-baseline="central">∂L/∂W2</text></g>
      <line x1="448" y1="85" x2="402" y2="85" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-coral"><rect x="450" y="63" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="500" y="81" text-anchor="middle" dominant-baseline="central">2(ŷ - y)</text><text class="ts" x="500" y="97" text-anchor="middle" dominant-baseline="central">∂L/∂ŷ</text></g>
      <line x1="598" y1="85" x2="552" y2="85" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-red"><rect x="600" y="63" width="70" height="44" rx="8" stroke-width="0.5"/><text class="th" x="635" y="81" text-anchor="middle" dominant-baseline="central">Loss</text><text class="ts" x="635" y="97" text-anchor="middle" dominant-baseline="central">起点</text></g>
      <text class="ts" x="340" y="148" text-anchor="middle">梯度从右向左流动，用链式法则逐层推算每个W的责任</text>
    </svg>`,
    notes: [
      { label: '∂L/∂ŷ = 2(ŷ-y)', desc: '损失函数对预测值求导，是反向传播的起点' },
      { label: 'xᵀ · grad', desc: '矩阵转置后相乘，是链式法则的矩阵形式' },
      { label: 'ReLU梯度', desc: '前向时 temp<0 的位置，梯度直接置0（不透传）' },
    ]
  },
  {
    title: '权重更新（Weight Update）',
    tag: '更新', tagClass: 'tag-amber',
    codes: [
      'w1 = w1 - learning_rate * grad_w1',
      'w2 = w2 - learning_rate * grad_w2',
      '',
      '# 以上步骤重复 500 次（iterations）',
      '# 每次 loss 下降 → 网络越来越准',
    ],
    hiLines: [0,1],
    svg: `<svg width="100%" viewBox="0 0 680 170">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g class="c-amber"><rect x="30" y="30" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="52" text-anchor="middle" dominant-baseline="central">旧权重 W</text><text class="ts" x="120" y="72" text-anchor="middle" dominant-baseline="central">当前参数值</text></g>
      <g class="c-coral"><rect x="30" y="110" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="128" text-anchor="middle" dominant-baseline="central">梯度 grad_W</text><text class="ts" x="120" y="144" text-anchor="middle" dominant-baseline="central">误差方向</text></g>
      <line x1="210" y1="58" x2="300" y2="58" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="210" y1="132" x2="248" y2="100" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-purple"><rect x="300" y="30" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="400" y="50" text-anchor="middle" dominant-baseline="central">W - lr × grad_W</text><text class="ts" x="400" y="68" text-anchor="middle" dominant-baseline="central">沿梯度反方向微调</text></g>
      <line x1="500" y1="58" x2="568" y2="58" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
      <g class="c-teal"><rect x="570" y="30" width="90" height="56" rx="8" stroke-width="0.5"/><text class="th" x="615" y="50" text-anchor="middle" dominant-baseline="central">新权重 W</text><text class="ts" x="615" y="68" text-anchor="middle" dominant-baseline="central">Loss 更小</text></g>
      <text class="ts" x="250" y="155" text-anchor="start">lr = 1e-6（学习率）控制每步移动多少</text>
    </svg>`,
    notes: [
      { label: 'W = W - lr × grad', desc: '梯度指向"Loss上升"方向，取反就是"下降"方向' },
      { label: 'lr = 1e-6', desc: '学习率极小，防止步子太大跳过最优点' },
      { label: '重复500次', desc: '每次迭代 loss 都在下降，最终收敛到较优的W值' },
    ]
  }
];

let cur = 0;

function render() {
  const s = steps[cur];
  for(let i=0;i<4;i++){
    document.getElementById('dot'+i).className = 'step-dot' + (i===cur?' active':'');
  }
  document.getElementById('panel').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;">
      <span style="font-size:16px;font-weight:500;color:var(--color-text-primary);">${s.title}</span>
      <span class="tag ${s.tagClass}">${s.tag}</span>
      <span style="font-size:12px;color:var(--color-text-tertiary);margin-left:auto;">${cur+1} / 4</span>
    </div>
    <div style="margin-bottom:1rem;">${s.svg}</div>
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 16px;margin-bottom:1rem;">
      ${s.codes.map((c,i)=>`<div class="code-line${s.hiLines.includes(i)?' hi':''}">${c || '&nbsp;'}</div>`).join('')}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${s.notes.map(n=>`<div style="display:flex;gap:10px;align-items:baseline;">
        <span style="font-family:var(--font-mono);font-size:12px;color:#534AB7;white-space:nowrap;min-width:130px;">${n.label}</span>
        <span style="font-size:13px;color:var(--color-text-secondary);">${n.desc}</span>
      </div>`).join('')}
    </div>
  `;
}

function nextStep(){ cur=(cur+1)%4; render(); }
function prevStep(){ cur=(cur+3)%4; render(); }
render();
</script>
